[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegean-energy"
version = "0.1.0.dev0"
description = "Research scaffold for renewable energy trading and battery optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.8,<4",
    "plotly>=5.18,<7",
]
app = [
    "streamlit>=1.32,<2",
    "plotly>=5.18,<7",
]
notebooks = [
    "jupyterlab>=4,<5",
    "ipykernel>=6.29,<8",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aegean*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
